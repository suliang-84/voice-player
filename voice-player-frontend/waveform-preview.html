<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>镜像对称波形预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      gap: 40px;
      padding: 40px;
    }

    h2 {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .label {
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    canvas {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    /* 控制栏样式 */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .time {
      color: #64748b;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
    }

    .theme-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .theme-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn:hover, .theme-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }
  </style>
</head>
<body>

  <h2>镜像对称波形 — 样式预览</h2>

  <!-- 样式切换 -->
  <div class="theme-row">
    <button class="theme-btn active" onclick="setTheme('purple')">紫蓝（默认暗色）</button>
    <button class="theme-btn" onclick="setTheme('green')">绿色科技</button>
    <button class="theme-btn" onclick="setTheme('orange')">橙色活力</button>
    <button class="theme-btn" onclick="setTheme('light')">亮色主题</button>
  </div>

  <!-- 波形卡片 -->
  <div class="card" id="card">
    <div class="label" id="trackLabel">A 路音频</div>
    <canvas id="waveCanvas" height="100"></canvas>
    <div class="controls">
      <button class="btn" id="playBtn" onclick="togglePlay()">▶</button>
      <span class="time" id="timeDisplay">00:00 / 01:45</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('waveCanvas')
    const ctx = canvas.getContext('2d')

    // 生成模拟波形数据（模拟真实语音的振幅包络）
    function generateFakeWaveform(count) {
      const data = []
      let value = 0.3
      for (let i = 0; i < count; i++) {
        // 模拟语音的随机振幅，带有自然的起伏
        const noise = (Math.random() - 0.5) * 0.4
        value = Math.max(0.05, Math.min(1, value + noise))

        // 模拟静音段（每隔一段有低振幅区）
        if (i % 80 < 12) value = value * 0.15

        // 模拟高能量段
        if (i > count * 0.3 && i < count * 0.5) value = Math.min(1, value * 1.3)

        data.push(value)
      }
      return data
    }

    const waveData = generateFakeWaveform(200)
    let progress = 0.28  // 当前播放进度（0-1）
    let playing = false
    let animFrame = null

    // 主题配置
    const themes = {
      purple: {
        bg: '#1e293b',
        bodyBg: '#0f172a',
        waveColor: '#4f46e5',
        progressColor: '#818cf8',
        progressGlow: 'rgba(129,140,248,0.4)',
        centerLine: '#312e81',
        label: '#64748b',
      },
      green: {
        bg: '#0d1f18',
        bodyBg: '#050f0a',
        waveColor: '#065f46',
        progressColor: '#10b981',
        progressGlow: 'rgba(16,185,129,0.4)',
        centerLine: '#064e3b',
        label: '#6b7280',
      },
      orange: {
        bg: '#1c1007',
        bodyBg: '#0f0800',
        waveColor: '#92400e',
        progressColor: '#f59e0b',
        progressGlow: 'rgba(245,158,11,0.4)',
        centerLine: '#78350f',
        label: '#78716c',
      },
      light: {
        bg: '#f8fafc',
        bodyBg: '#e2e8f0',
        waveColor: '#cbd5e1',
        progressColor: '#2563eb',
        progressGlow: 'rgba(37,99,235,0.2)',
        centerLine: '#e2e8f0',
        label: '#64748b',
      }
    }

    let currentTheme = themes.purple

    function setTheme(name) {
      currentTheme = themes[name]
      document.body.style.background = currentTheme.bodyBg
      document.getElementById('card').style.background = currentTheme.bg
      document.getElementById('trackLabel').style.color = currentTheme.label
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'))
      event.target.classList.add('active')
      drawWaveform()
    }

    function drawWaveform() {
      const dpr = window.devicePixelRatio || 1
      const rect = canvas.getBoundingClientRect()
      canvas.width = rect.width * dpr
      canvas.height = 100 * dpr
      ctx.scale(dpr, dpr)

      const W = rect.width
      const H = 100
      const centerY = H / 2
      const barCount = waveData.length
      const barWidth = W / barCount
      const maxAmp = centerY * 0.88

      ctx.clearRect(0, 0, W, H)

      for (let i = 0; i < barCount; i++) {
        const x = i * barWidth
        const amp = waveData[i] * maxAmp
        const isPlayed = (i / barCount) < progress

        if (isPlayed) {
          ctx.shadowColor = currentTheme.progressGlow
          ctx.shadowBlur = 6
          ctx.fillStyle = currentTheme.progressColor
        } else {
          ctx.shadowBlur = 0
          ctx.fillStyle = currentTheme.waveColor
        }

        const gap = barWidth * 0.25
        const bw = barWidth - gap
        const bx = x + gap / 2
        // 上半部分
        ctx.fillRect(bx, centerY - amp, bw, amp)
        // 下半部分（镜像）
        ctx.fillRect(bx, centerY, bw, amp)
      }

      ctx.shadowBlur = 0

      // ── 中心线 ──────────────────────────────────────────────────
      ctx.strokeStyle = currentTheme.centerLine
      ctx.lineWidth = 1
      ctx.beginPath()
      ctx.moveTo(0, centerY)
      ctx.lineTo(W, centerY)
      ctx.stroke()

      // ── 播放游标 ─────────────────────────────────────────────────
      const cursorX = progress * W
      ctx.strokeStyle = currentTheme.progressColor
      ctx.lineWidth = 2
      ctx.shadowColor = currentTheme.progressGlow
      ctx.shadowBlur = 10
      ctx.beginPath()
      ctx.moveTo(cursorX, 4)
      ctx.lineTo(cursorX, H - 4)
      ctx.stroke()
      ctx.shadowBlur = 0
    }

    // 绘制圆角矩形（只圆某些角）
    function roundRect(ctx, x, y, w, h, r, roundTop, roundBottom) {
      ctx.beginPath()
      if (roundTop) {
        ctx.moveTo(x + r, y)
        ctx.lineTo(x + w - r, y)
        ctx.arcTo(x + w, y, x + w, y + r, r)
        ctx.lineTo(x + w, y + h)
        ctx.lineTo(x, y + h)
        ctx.lineTo(x, y + r)
        ctx.arcTo(x, y, x + r, y, r)
      } else {
        ctx.moveTo(x, y)
        ctx.lineTo(x + w, y)
        ctx.lineTo(x + w, y + h - r)
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r)
        ctx.lineTo(x + r, y + h)
        ctx.arcTo(x, y + h, x, y + h - r, r)
        ctx.lineTo(x, y)
      }
      ctx.closePath()
    }

    // 播放动画
    function togglePlay() {
      playing = !playing
      document.getElementById('playBtn').textContent = playing ? '⏸' : '▶'
      if (playing) animate()
      else cancelAnimationFrame(animFrame)
    }

    function animate() {
      progress += 0.001
      if (progress >= 1) { progress = 0; playing = false; document.getElementById('playBtn').textContent = '▶'; return }
      const total = 105
      const current = Math.floor(progress * total)
      const cm = String(Math.floor(current / 60)).padStart(2, '0')
      const cs = String(current % 60).padStart(2, '0')
      document.getElementById('timeDisplay').textContent = `${cm}:${cs} / 01:45`
      drawWaveform()
      animFrame = requestAnimationFrame(animate)
    }

    // 点击跳转
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect()
      progress = (e.clientX - rect.left) / rect.width
      drawWaveform()
    })

    // 初始化
    window.addEventListener('resize', drawWaveform)
    setTimeout(drawWaveform, 50)
  </script>
</body>
</html>
